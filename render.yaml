services:
  - type: web
    name: landwise-mongolia-finder
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build:check && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
